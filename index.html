<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Web</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
        }

        .app-wrapper {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .app-header {
            text-align: center;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .app-header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
        }

        /* Kotak Kamera & Pengaturan */
        .camera-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            width: 600px;
            max-width: 100%;
        }

        .video-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            aspect-ratio: 4/3;
        }

        #camera-stream {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transform: scaleX(-1);
            transition: filter 0.3s;
        }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 150px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 40px rgba(0,0,0,0.8);
            margin: 0;
            line-height: 1;
        }

        .hidden { display: none !important; }

        .controls {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Grup Pengaturan (Layout & Frame) */
        .settings-group {
            display: flex;
            gap: 15px;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .setting-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 150px;
        }

        .setting-item label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e0e0e0;
        }

        .setting-item select {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }

        .setting-item select option {
            background: #2b5876;
            color: white;
        }

        /* Tombol Filter */
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .filter-btn.active, .filter-btn:hover {
            background: white;
            color: #2b5876;
            transform: scale(1.05);
            border-color: white;
        }

        /* Tombol Utama */
        #capture-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #capture-btn:hover {
            transform: translateY(-3px);
            background: #ff6b81;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.6);
        }

        #capture-btn:disabled {
            background: #a4b0be;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Hasil Cetakan */
        .result-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 300px;
        }

        #final-strip {
            background: white; /* Fallback */
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
            max-height: 80vh; /* Agar tidak terlalu panjang ke bawah di layar */
            border-radius: 8px;
            object-fit: contain;
        }

        #download-btn {
            display: block;
            margin-top: 20px;
            text-align: center;
            background: #2ed573;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(46, 213, 115, 0.4);
        }

        #download-btn:hover { 
            background: #7bed9f; 
            transform: translateY(-3px);
        }

        .camera-error-msg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #222;
            color: #ff6b81;
            text-align: center;
            padding: 20px;
            font-size: 1rem;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <h1>📸 Photobooth Studio</h1>
        </header>

        <div class="main-content">
            <!-- Sisi Kiri: Kamera & Pengaturan -->
            <div class="camera-card">
                <div class="video-container" id="video-container">
                    <video id="camera-stream" autoplay playsinline></video>
                    <div id="countdown" class="hidden"></div>
                </div>
                
                <div class="controls">
                    <!-- Opsi Filter -->
                    <div class="filters">
                        <button class="filter-btn active" data-filter="none">Normal</button>
                        <button class="filter-btn" data-filter="grayscale(100%)">Hitam Putih</button>
                        <button class="filter-btn" data-filter="sepia(80%)">Vintage</button>
                        <button class="filter-btn" data-filter="contrast(120%) saturate(120%)">Vivid</button>
                    </div>

                    <!-- Opsi Layout & Bingkai -->
                    <div class="settings-group">
                        <div class="setting-item">
                            <label for="layout-select">🖼️ Layout Cetakan:</label>
                            <select id="layout-select">
                                <option value="1x3">Strip Panjang (1x3 Foto)</option>
                                <option value="2x2">Grid Persegi (2x2 Foto)</option>
                                <option value="2x3">Grid Besar (2x3 Foto)</option>
                                <option value="3x3">Grid Kolase (3x3 Foto)</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label for="frame-color">🎨 Warna Bingkai:</label>
                            <select id="frame-color">
                                <option value="#ffffff">Putih Bersih</option>
                                <option value="#111111">Hitam Elegan</option>
                                <option value="#ffeaa7">Kuning Pastel</option>
                                <option value="#ffcccc">Pink Pastel</option>
                                <option value="#c7ecee">Biru Muda</option>
                            </select>
                        </div>
                    </div>

                    <button id="capture-btn">📸 Mulai Sesi (3 Foto)</button>
                </div>
            </div>

            <!-- Sisi Kanan: Hasil Cetakan -->
            <div class="result-section">
                <canvas id="strip-canvas" style="display: none;"></canvas>
                <img id="final-strip" alt="Hasil Photobooth" style="display: none;">
                <a id="download-btn" style="display: none;" download="photobooth.png">⬇️ Download Foto</a>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('strip-canvas');
        const ctx = canvas.getContext('2d');
        const finalStrip = document.getElementById('final-strip');
        const captureBtn = document.getElementById('capture-btn');
        const countdownEl = document.getElementById('countdown');
        const downloadBtn = document.getElementById('download-btn');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const layoutSelect = document.getElementById('layout-select');
        const frameColorSelect = document.getElementById('frame-color');

        let currentFilter = 'none';

        // Konfigurasi Jenis Layout
        const layoutConfigs = {
            '1x3': { cols: 1, rows: 3 },
            '2x2': { cols: 2, rows: 2 },
            '2x3': { cols: 2, rows: 3 },
            '3x3': { cols: 3, rows: 3 }
        };

        // Update Tombol Mulai Sesi saat layout diganti
        layoutSelect.addEventListener('change', () => {
            const config = layoutConfigs[layoutSelect.value];
            const total = config.cols * config.rows;
            captureBtn.innerText = `📸 Mulai Sesi (${total} Foto)`;
        });

        // Logika Penggantian Filter Warna Layar
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                video.style.filter = currentFilter;
            });
        });

        // Setup Kamera
        async function setupCamera() {
            try {
                // Meminta resolusi lebih tinggi agar cetakan grid tidak pecah
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 960 } });
                video.srcObject = stream;
            } catch (error) {
                console.error("Kamera gagal diakses:", error);
                const container = document.getElementById('video-container');
                const errorDiv = document.createElement('div');
                errorDiv.className = 'camera-error-msg';
                errorDiv.innerHTML = `
                    <span>⚠️ Kamera tidak dapat diakses</span>
                    <span style="font-size: 0.8rem; color: #ccc;">Pastikan Anda memberi izin akses kamera atau salin kode ini ke local Anda.</span>
                `;
                container.appendChild(errorDiv);
                captureBtn.disabled = true;
                captureBtn.innerText = "Kamera Terblokir";
            }
        }
        setupCamera();

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // Logika Utama Memotret & Menyusun Layout (Grid)
        captureBtn.addEventListener('click', async () => {
            // Ambil konfigurasi layout saat ini
            const layoutType = layoutSelect.value;
            const { cols, rows } = layoutConfigs[layoutType];
            const totalPhotos = cols * rows;

            captureBtn.disabled = true;
            captureBtn.innerText = `⏳ Memotret (0/${totalPhotos})...`;
            
            // Konfigurasi Ukuran & Jarak Kertas Cetakan
            const photoWidth = 800; // Ukuran resolusi dalam canvas lebih besar agar HD
            const photoHeight = 600;
            const gap = 30; // Jarak antar foto
            const padding = 50; // Bingkai luar
            const bottomPadding = 120; // Ruang untuk tanggal di bawah

            // Kalkulasi Ukuran Canvas Dinamis berdasarkan Kolom & Baris
            canvas.width = (padding * 2) + (photoWidth * cols) + (gap * (cols - 1));
            canvas.height = padding + (photoHeight * rows) + (gap * (rows - 1)) + bottomPadding;

            // Warnai background sesuai pilihan
            const frameColor = frameColorSelect.value;
            ctx.fillStyle = frameColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Loop untuk mengambil foto sebanyak 'totalPhotos'
            for (let i = 0; i < totalPhotos; i++) {
                captureBtn.innerText = `⏳ Memotret (${i+1}/${totalPhotos})...`;
                
                // Hitung Mundur
                countdownEl.classList.remove('hidden');
                for (let count = 3; count > 0; count--) {
                    countdownEl.innerText = count;
                    await sleep(1000);
                }
                countdownEl.innerText = "📸";
                await sleep(400); // Waktu kilat flash
                countdownEl.classList.add('hidden');

                // Kalkulasi Koordinat X & Y untuk sistem Grid
                const colIndex = i % cols;
                const rowIndex = Math.floor(i / cols);
                
                const visualX = padding + colIndex * (photoWidth + gap);
                const yPos = padding + rowIndex * (photoHeight + gap);

                // Gambar ke canvas dengan efek cermin dan posisi yang benar
                ctx.save();
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1); 
                
                // Rumus matematika agar posisi X tidak terbalik di canvas yang di-mirror
                const flippedX = canvas.width - visualX - photoWidth;
                
                ctx.filter = currentFilter; // Terapkan efek Hitam Putih/Vintage
                ctx.drawImage(video, flippedX, yPos, photoWidth, photoHeight);
                ctx.restore();
                
                await sleep(800); // Jeda sebelum jepretan selanjutnya
            }

            // Tulis Tanggal di bagian tengah bawah
            // Pilih warna teks agar kontras dengan warna bingkai
            ctx.fillStyle = (frameColor === '#111111') ? '#dddddd' : '#555555';
            ctx.font = "bold 35px 'Poppins', sans-serif";
            ctx.textAlign = "center";
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = new Date().toLocaleDateString('id-ID', options);
            ctx.fillText(dateStr, canvas.width / 2, canvas.height - 45);

            // Tampilkan Hasil Akhirnya
            const dataURL = canvas.toDataURL('image/png');
            finalStrip.src = dataURL;
            finalStrip.style.display = "block";
            
            downloadBtn.href = dataURL;
            downloadBtn.style.display = "block";

            // Kembalikan UI Tombol
            captureBtn.innerText = `📸 Mulai Sesi (${totalPhotos} Foto)`;
            captureBtn.disabled = false;
        });
    </script>
</body>
</html>

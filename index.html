<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Photobooth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="camera-section">
            <video id="camera-stream" autoplay playsinline></video>
            <div id="countdown" class="hidden"></div>
            
            <button id="capture-btn">📸 Mulai Sesi (3 Foto)</button>
        </div>

        <div class="result-section">
            <canvas id="strip-canvas" style="display: none;"></canvas>
            
            <img id="final-strip" alt="Photo Strip Template" style="display: none;">
            <a id="download-btn" style="display: none;" download="photostrip-ku.png">⬇️ Download Template</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
